<!doctype html>
<!--
  Generation replay: watch an upload become a 3D field, step by step, using the real outputs.
  Serve the repo root over HTTP (browsers block modules and fetch on file://):
    python3 -m http.server 8765
  then open http://127.0.0.1:8765/blender/preview/generate.html
  Options: ?t=avon|pecos|delaware  &speed=1|2|4  &autoplay=0
  The templates come from blender/build_templates.py: the real ingest result, the real review
  list, and the real generator build. Only the timing is slowed down so people can follow it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation Replay</title>
<style>
  :root { --bg: #20252b; --panel: #15191e; --line: #2c333b; --text: #dde3ea; --dim: #8b96a3; --accent: #f2b33d;
          --ok: #5bbf7a; --warn: #e0a03a; --bad: #c6403a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 360px; height: 100vh; overflow: hidden; }
  #view { position: relative; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; font: inherit; cursor: pointer; }
  select { flex: 1; min-width: 0; }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #note { margin-top: 8px; }
  ol#steps { list-style: none; margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  #steps li { display: grid; grid-template-columns: 14px 64px 1fr; gap: 8px; align-items: baseline; color: var(--dim); }
  #steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); transform: translateY(1px); }
  #steps li.on { color: var(--text); }
  #steps li.on::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px rgba(242,179,61,.18); }
  #steps li.done { color: var(--text); }
  #steps li.done::before { border-color: var(--ok); background: var(--ok); }
  #steps b { font-weight: 600; }
  #steps .info { font-size: 12px; }
  #detail { overflow: auto; flex: 1; padding: 12px 16px 16px; }
  #detail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 4px 0 8px; }
  pre.src { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.5 var(--mono); white-space: pre; overflow: auto; max-height: 50vh; }
  pre.src .hot { background: rgba(242,179,61,.18); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0; border-bottom: 1px solid var(--line); animation: in .25s ease-out; }
  .item .id { font: 600 12px var(--mono); color: var(--accent); }
  .item .from { color: var(--dim); font-size: 12px; }
  .pill { font: 11px var(--mono); padding: 1px 6px; border-radius: 9px; border: 1px solid var(--line); align-self: center; }
  .pill.ok { color: var(--ok); border-color: rgba(91,191,122,.4); }
  .pill.warn { color: var(--warn); border-color: rgba(224,160,58,.45); }
  .issue { grid-column: 1 / -1; color: var(--warn); font-size: 12px; }
  .issue.fixed { color: var(--ok); }
  .counters { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .counters .n { font: 12px var(--mono); text-align: right; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-variant-numeric: tabular-nums; }
  .stats .v { font: 600 13px var(--mono); text-align: right; }
  .callout { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; }
  a { color: var(--accent); }
  footer { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; }
  #caption { position: absolute; left: 16px; bottom: 16px; right: 16px; pointer-events: none; }
  #caption .step { font: 600 20px/1.2 system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #caption .sub { color: var(--dim); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #bar { height: 3px; background: rgba(255,255,255,.08); margin-top: 10px; border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #banner { position: absolute; top: 12px; left: 12px; right: 12px; padding: 10px 14px; background: var(--bad); color: #fff; border-radius: 4px; display: none; white-space: pre-wrap; z-index: 2; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .item { animation: none; } }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } #side { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script>
  // Runs before the module, so a failed module load still says what went wrong.
  function replayError(msg) { var b = document.getElementById("banner"); if (b) { b.textContent = msg; b.style.display = "block"; } }
  window.addEventListener("error", function (e) { replayError("Replay error: " + (e.message || e)); });
  if (location.protocol === "file:") window.addEventListener("load", function () {
    replayError("Open this page over HTTP, not file://. From the repo root run: python3 -m http.server 8765");
  });
</script>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="view">
  <div id="banner" role="alert"></div>
  <div id="caption" aria-live="polite"><div class="step" id="capStep">Loading</div><div class="sub" id="capSub"></div><div id="bar"><i></i></div></div>
</div>
<aside id="side">
  <header>
    <h1>Generation replay</h1>
    <div class="dim">From an uploaded plan to a 3D field, using the real outputs.</div>
    <div class="row">
      <label class="dim" for="tpl">Field</label>
      <select id="tpl"></select>
    </div>
    <div class="row">
      <button class="primary" id="play">Replay</button>
      <button id="skip">Skip to end</button>
      <span class="dim">Speed</span>
      <button data-speed="1" aria-pressed="true">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button>
    </div>
    <div id="note" class="dim"></div>
  </header>
  <ol id="steps"></ol>
  <div id="detail" aria-live="polite"></div>
  <footer class="dim">Each step uses the real result: what ingest read, what review asked, and what the generator built. Only the timing is slowed down. <a id="open" href="index.html">Open this field in the preview</a></footer>
</aside>
<script type="module" src="./generate.js"></script>
</body>
</html>
